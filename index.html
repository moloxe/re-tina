 scene = calcScene(uv);\n    var color = scene.color.rgb;\n    if scene.dist &lt; 0 {\n      var seed = toSpherical(scene.rd);\n      seed.z += U.time * 0.1; seed.y += U.time * 0.1;\n      seed = toCartesian(seed);\n      let n = (\n        (snoise3d(vec3f(seed * 10.)) + 1f) / 2f +\n        (snoise3d(vec3f(seed * 20.)) + 1f) / 2f\n      ) / 2f;\n      let nebula = hsv2rgb(vec3f(n, 0.4, 6. * (n - 0.6)));\n      color = mix(\n        vec3f(0, 0, 0.1),\n        nebula,\n        min(pow(max(scene.rd.y + 0.8, 0.), 8.), 1.)\n      );\n    }\n    return vec4f(color, 1);\n  `,\n})\n\n// Dynamic Morphology World (without smiley face)\nrt.registerMaterial({\n  sdFunc: /* wgsl */ `\n    let t = U.time * 0.2 - 0.3f;\n    // --- WORLD\n    let d1 = sdD1(pos, t) * 0.8;\n    let d2 = sdD2(pos) * 0.7;\n    let f1 = pow(sin(t), 10f);\n    let f2 = pow(sin(t + 1. / 4. * PI), 16f);\n    let f3 = pow(sin(t + 2. / 4. * PI), 16f);\n    let f4 = pow(sin(t + 3. / 4. * PI), 16f);\n    let world = (d1 * f1 + d2 * f2 + d1 * f3 + d2 * f4);\n    // --- VIEW CAPSULE\n    let camPos = vec3f(U.camPosX, U.camPosY, U.camPosZ);\n    let ro = camPos + rotateXY(vec3f(0., 0., U.camSphericalR), U.camSphericalP, U.camSphericalT);\n    let offset = vec3f(0, -0.4, 0);\n    let playerHead = camPos + offset;\n    let viewCapsule = sdCapsule(pos, playerHead, ro, 0.6f);\n    // ---\n    return opSmoothSubtraction(viewCapsule, world, 0.1);\n  `,\n  lightFunc: /* wgsl */ `\n    let lambertian = dot(normal, -rd);\n    let bri = 0.1 + lambertian * 0.5;\n    let finalColor = hsv2rgb(vec3&lt;f32&gt;(rgb2hsv(normal * 0.5 + 0.5).x, 0.8, bri)) + vec3f(pow(lambertian, 64f));\n    return vec4&lt;f32&gt;(finalColor, 1.);\n  `,\n})\n\nrt.setControlsTo3rdPerson({\n  initPos: { x: 0, y: 4, z: 4 },\n})\n\nrt.start()\n&quot;]}],[0,{&quot;route&quot;:[0,&quot;3D-collisions&quot;],&quot;sketch&quot;:[0,&quot;import ReTina from &#39;https://moloxe.github.io/re-tina/lib.js&#39;\n\nconst rt = new ReTina({\n  showFps: true,\n})\n\nrt .y * 0.2;\n    }\n    return vec4f(color, 1);\n  `,\n  functions: /* wgsl */ `\n    const lightColor = vec3f(1.0, 0.9, 0.8);\n    const lightPower = 40.0;\n    fn getLightPos() -&gt; vec3f {\n      return vec3f(0, 8, U.camPosZ - 5);\n    }\n\n    // Fractal Brownian Motion\n    fn fbm(p_in: vec3f, OCTAVES: i32) -&gt; f32 {\n        var value = 0.0;\n        var amplitude = 0.5;\n        var frequency = 1.0;\n        var p = p_in;\n        for (var i = 0; i &lt; OCTAVES; i++) {\n            value += amplitude * snoise3d(p * frequency);\n            p = p * 2.0;\n            frequency *= 1.2;\n            amplitude *= 0.5;\n        }\n        return value;\n    }\n  `,\n})\n\nconst ZONE_LIMIT = /* wgsl */ `\n  let zone = sdSphere(pos, 2.0);\n  if zone &gt; 0.3 { return zone * 0.5; }\n`\n\n// Grass\nrt.registerMaterial({\n  sdFunc: /* wgsl */ `\n    ${ZONE_LIMIT}\n    let height = fbm(pos * 0.5, 4) * 2.0;\n    var terrain = pos.y - height + 0.2;\n    terrain = max(zone, terrain);\n    return terrain * 0.2;\n  `,\n  lightFunc: /* wgsl */ `\n    let minBright = 0.1;\n    let diffuseColor = vec3f(0.5, 1., 0.5);\n    let shininess = 32.0;\n    let lightPos = getLightPos();\n    let light = blinnPhong(\n      // Environment\n      rd, normal, minBright,\n      // Material\n      pos, diffuseColor, shininess,\n      // Light\n      lightPos, lightColor, lightPower,\n    );\n    return vec4f(light, 1);\n  `,\n})\n\n// Watter\nrt.registerMaterial({\n  sdFunc: /* wgsl */ `\n    let zone = sdSphere(pos, 2);\n    return max(zone, pos.y);\n  `,\n  lightFunc: /* wgsl */ `\n    let minBright = 0.1;\n    let diffuseColor = vec3f(0.2, 0.6, 1.);\n    let shininess = 512.0;\n    let lightPos = getLightPos();\n    let n = pos + snoise3d(pos);\n    let t = U.time * 5;\n    let waves = vec3f(sin(n.x * 25 - t) * 0.1, pos.y, cos(n.z * 25 + t) * 0.1);\n    let light = blinnPhong(\n      // Environment\n      rd, normalize(normal + waves), minBright,\n      // Material\n      pos, diffuseColor, shininess,\n      // Light\n      lightPos, lightColor, lightPower,\n    );\n    return vec4f(light, 1);\n  `,\n})\n\n// Clouds\nrt.registerMaterial({\n  sdFunc: /* wgsl */ `\n    ${ZONE_LIMIT}\n    pos.x += U.time / 30;\n    pos.x /= 3;\n    pos.z /= 3;\n    var cloud =\n      pos.y -\n      fbm(pos, 4) * 2.0 +\n      snoise3d((vec3f(pos.x, pos.y + U.time / 20, pos.z)) * 2.0) * 0.5;\n    cloud = opSmoothSubtraction(pos.y - 0.65, cloud, 0.3);\n    cloud = max(zone, cloud);\n    return cloud * 0.2;\n  `,\n  lightFunc: /* wgsl */ `\n    let minBright = 0.8;\n    let diffuseColor = vec3f(0.9, 0.9, 0.9);\n    let shininess = 64.0;\n    let lightPos = getLightPos();\n    let light = blinnPhong(\n      // Environment\n      rd, normal, minBright,\n      // Material\n      pos, diffuseColor, shininess,\n      // Light\n      lightPos, lightColor, lightPower,\n    );\n    return vec4f(light, 1);\n  `,\n})\n\nrt.camera.fov = 50\nrt.camera.spherical = { radius: 4, theta: 0.5, phi: -0.4 }\n\nrt.setControlsToFree()\nrt.start()\n&quot;]}],[0,{&quot;route&quot;:[0,&quot;3D-fractal-mandelbulb&quot;],&quot;sketch&quot;:[0,&quot;import ReTina from &#39;https://moloxe.github.io/re-tina/lib.js&#39;\n\n// Shader based on: https://webgpulab.xbdev.net/index.php?page=editor&amp;id=mandelbulbbasic3&amp;\nconst rt = new ReTina({\n  showFps: true,\n  height: 512,\n  useInterlacing: true,\n})\n\nrt.registerMaterial({\n  sdFunc: /* wgsl */ `\n    var power = 6 + 4 * sin(U.time * 0.1);\n    var z = pos;\n    var c = pos;\n    var dr = 1.0;\n    var r = 0.0;\n    for (var i: i32 = 0; i &lt; 16; i++) {\n        r = length(z);\n        if r &gt; 2.0 { break; }\n        var theta = acos(z.z / r);\n        var phi = atan2(z.y, z.x);\n        let rp = pow(r, power - 1.0);\n        dr = rp * power * dr + 1.0;\n        let zr = rp * r;\n        theta *= power;\n        phi *= power;\n        z = zr * vec3(sin(theta) * cos(phi), sin(phi) * sin(theta), cos(theta));\n        z += c;\n    }\n    return 0.5 * log(r) * r / dr - 0.001;\n  `,\n  lightFunc: /* wgsl */ `\n    let lightPos = toCartesian(vec3f(2, toSpherical(ro).yz));\n    let hue = toSpherical(pos).y + U.time * 0.2;\n    let diffuseColor = hsv2rgb(vec3f(hue, 0.5, 1));\n    let lightColor = hsv2rgb(vec3f(0.2));\n    let light = blinnPhong(\n      // Environment\n      rd, normal, /* minBright */ 0,\n      // Material\n      pos, diffuseColor, /* shininess */ 128,\n      // Light\n      lightPos, lightColor, /* power */ 8,\n    );\n    return vec4f(light, 1.);\n  `,\n})\n\nrt.camera = {\n  fov: 60,\n  pos: {\n    x: 0.6,\n    y: 0.8,\n    z: 1.5,\n  },\n  spherical: {\n    phi: -0.5,\n    radius: 0,\n    theta: 0.4,\n  },\n}\n\nrt.setControlsToFree()\n\nrt.start()\n&quot;]}],[0,{&quot;route&quot;:[0,&quot;3D-fractal-trees&quot;],&quot;sketch&quot;:[0,&quot;import ReTina from &#39;https://moloxe.github.io/re-tina/lib.js&#39;\n\n// https://x.com/zozuar/status/1763906851337326736\n\nconst rt = new ReTina({\n  fps: 60,\n  showFps: true,\n  height: 480,\n  functions: /* wgsl */ `\n    fn rotate2D(a : f32) -&gt; mat2x2&lt;f32&gt; {\n        return mat2x2&lt;f32&gt;(cos(a), sin(a), -sin(a), cos(a));\n    }`,\n})\n\nrt.registerMaterial({\n  sdFunc: /* wgsl */ `\n    var p  = pos; p.y = -p.y;\n    var e  = 7.0;\n    var v  = 7.0;\n    var uu = 1e-6;\n    for (var j = 7.0; j &lt; 21.0; j += 1.0) {\n        let rot    = rotate2D(j + sin(1.0 / uu) / v);\n        let xz_rot = rot * p.xz;\n        p = vec3&lt;f32&gt;(abs(xz_rot.x) - 0.53,\n                      p.y,\n                      abs(xz_rot.y) - 0.53);\n        p.y = 1.8 - p.y;\n        let cyl = length(p.xz) - 0.02 / uu;\n        e = min(e, max(cyl, p.y) / v);\n        uu  = dot(p, p);\n        v  /= uu;\n        p  /= uu + 0.01;\n    }\n    return e * 1.5f;\n  `,\n})\n\nrt.camera.fov = 60\nrt.camera.pos.y = -1\nrt.camera.pos.z = 2\n\nrt.setControlsToFree()\nrt.start()\n&quot;]}],[0,{&quot;route&quot;:[0,&quot;3D-fractal-world&quot;],&quot;sketch&quot;:[0,&quot;import ReTina from &#39;https://moloxe.github.io/re-tina/lib.js&#39;\n\nconst rt = new ReTina({\n  showFps: true,\n  height: 512,\n  useInterlacing: true,\n})\n\n// Based on: https://shaders.skia.org/?id=ed72577c437c036447372e4c873462fc1bbfc0cb5e9fb0630ab1c07368a0db48\nrt.registerMaterial({\n  sdFunc: /* wgsl */ `\n    pos.z -= U.time * 0.5;\n    pos = asin(sin(pos)) - vec3&lt;f32&gt;(3.0);\n    for (var i = 0; i &lt; 9; i++) {\n        pos = abs(vec3&lt;f32&gt;(pos.xz, pos.y).xzy);\n        if (pos.x &lt; pos.y) {\n            pos = pos.zxy;\n        } else {\n            pos = pos.zyx;\n        }\n        pos = pos + pos - vec3&lt;f32&gt;(1.0, 3.0, 7.0);\n    }\n    let dist = max(pos.x, pos.z) / 1000.0 - 0.01;\n    return dist;\n  `,\n  lightFunc: /* wgsl */ `\n    var spec = 0.;\n    let lambertian = dot(normal, -rd);\n    if lambertian &gt; 0. {\n        let lightDir = normalize(ro - pos);\n        let halfDir = normalize(lightDir + -rd);\n        spec = pow(max(dot(halfDir, normal), 0.), 2000.);\n    }\n    var dd = length(pos - ro); dd = 1 + (dd * dd  * .01);\n    var out = normal * normal;\n    out = rgb2hsv(out);\n    out = hsv2rgb(vec3&lt;f32&gt;(out.x + U.time * .2 + sin(pos.x + pos.y) / 4., .6, .6));\n    out = (out * lambertian + spec) / dd;\n    return vec4&lt;f32&gt;(out, 1.);\n  `,\n})\n\nrt.camera.fov = 100\nrt.camera.spherical = {\n  radius: 0,\n  phi: 0,\n  theta: 0.2,\n}\n\nrt.setControlsToFree()\nrt.start()\n&quot;]}],[0,{&quot;route&quot;:[0,&quot;3D-modeling&quot;],&quot;sketch&quot;:[0,&quot;import ReTina from &#39;https://moloxe.github.io/re-tina/lib.js&#39;\n\nconst rt = new ReTina({\n  showFps: true,\n})\n\n// Head\nrt.registerMaterial({\n  color: { r: 0.5, g: 0.5, b: 0.5 },\n  sdFunc: /* wgsl */ `\n    let dBox = sdBox(pos, vec3&lt;f32&gt;(0.26, 0.14, 0.08));\n    let dSphere = sdSphere(pos, 0.1);\n    return opSmoothUnion(dBox, dSphere, 0.5);\n  `,\n  lightFunc: /* wgsl */ `\n    let minBright = 0.5;\n    let diffuseColor = color;\n    let shininess = 256.;\n    let lightPos = toCartesian(vec3f(1.3, PI / 2., PI / 2.));\n    let lightColor = vec3f(1);\n    let power = 1.;\n    let light = blinnPhong(\n      // Environment\n      rd, normal, minBright,\n      // Material\n      pos, diffuseColor, shininess,\n      // Light\n      lightPos, lightColor, power,\n    );\n    return vec4f(light, 1.);\n  `,\n})\n\n// Sun glasses\nrt.registerMaterial({\n  pos: { x: 0, y: 0.03, z: 0.22 },\n  color: { r: 0, g: 0, b: 0 },\n  sdFunc: /* wgsl */ `\n    let left  = sdBox(pos - vec3&lt;f32&gt;(0.15, 0.0, 0.0), vec3&lt;f32&gt;(0.12, 0.08, 0.001));\n    let right = sdBox(pos - vec3&lt;f32&gt;(-0.15, 0.0, 0.0), vec3&lt;f32&gt;(0.12, 0.08, 0.001));\n    let mid = sdCapsule(pos - vec3&lt;f32&gt;(0.0, 0.04, 0.0), vec3&lt;f32&gt;(0.05, 0, 0), vec3&lt;f32&gt;(-0.05, 0, 0), 0.01);\n    return opSmoothUnion(min(left, right), mid, 0.02);\n  `,\n  lightFunc: /* wgsl */ `\n    let minBright = 0.;\n    let diffuseColor = color;\n    let shininess = 2056.;\n    let lightPos = toCartesian(vec3f(1.3, 0, 0));\n    let lightColor = vec3f(1);\n    let power = 2.;\n    let light = blinnPhong(\n      // Environment\n      rd, normal, minBright,\n      // Material\n      pos, diffuseColor, shininess,\n      // Light\n      lightPos, lightColor, power,\n    );\n    return vec4f(light, 1.);\n  `,\n})\n\n// Body\nrt.registerMaterial({\n  sdFunc: /* wgsl */ `\n    let dBody = sdCapsule(pos, vec3&lt;f32&gt;(0, -0.32, 0), vec3&lt;f32&gt;(0, -0.4, 0), 0.08);\n    let leftLeg = sdCapsule(pos, vec3&lt;f32&gt;(-0.04, -0.45, 0), vec3&lt;f32&gt;(-0.07, -0.55, 0), 0.05);\n    let rightLeg = sdCapsule(pos, vec3&lt;f32&gt;(0.04, -0.45, 0), vec3&lt;f32&gt;(0.07, -0.55, 0), 0.05);\n    let dLegs = min(leftLeg, rightLeg);\n    return opSmoothUnion(dBody, dLegs, 0.04);\n  `,\n  lightFunc: /* wgsl */ `\n    var n = snoise3d(pos * 20.);\n    n = snoise3d(vec3&lt;f32&gt;(pos.xy, n + U.time)) * 0.5 + 0.5;\n    n = pow(n, 2.0);\n    let c = hsv2rgb(vec3&lt;f32&gt;(pos.y + U.time, 1.0 - n, n));\n    let lambertian = dot(normal, -rd);\n    return vec4&lt;f32&gt;(c * lambertian, 1.);\n  `,\n})\n\n// Environment\nrt.registerMaterial({\n  color: { r: 0.4, g: 0.6, b: 0.6 },\n  sdFunc: /* wgsl */ `\n    let dFloor = sdBox(pos - vec3&lt;f32&gt;(0, -0.6, 0), vec3&lt;f32&gt;(1, 0.01, 0.3));\n    let dWall = sdBox(pos - vec3&lt;f32&gt;(0, 0, -0.3), vec3&lt;f32&gt;(1, 0.6, 0.01));\n    return min(dFloor, dWall);\n  `,\n})\n\nrt.camera.fov = 60\nrt.camera.spherical.radius = 1.2\nrt.camera.spherical.theta = 0.3\n\nrt.setControlsToFree()\n\nrt.start()\n&quot;]}],[0,{&quot;route&quot;:[0,&quot;3D-morphology-abstract&quot;],&quot;sketch&quot;:[0,&quot;import ReTina from &#39;https://moloxe.github.io/re-tina/lib.js&#39;\n\nconst rt = new ReTina({\n  height: Math.min(800, window.innerHeight * window.devicePixelRatio * 1.2),\n  functions: /* wgsl */ `\n    fn sdD1(pos: vec3f, t: f32) -&gt; f32 {\n      return (pos.y - (\n        snoise3d(vec3f(pos.xz * 0.1, t * 2f)) +\n        snoise3d(vec3f(pos.xz * 0.2, t * 1f))\n      ));\n    }\n    fn sdD2(pos: vec3f) -&gt; f32 {\n      return (sin(pos.y) - (cos(pos.x) + cos(pos.y) + cos(pos.z)));\n    }\n    // https://www.shadertoy.com/view/WcXGW2\n    fn sdD3(_p: vec3f) -&gt; f32 {\n      var p = _p - vec3f(U.camPosX - 1f, U.camPosY - 1.2f, U.camPosZ - 1.2f);\n      p = rotate(p, vec3f(0.5, -0.6, 0));\n      var d = sdSphere(p, 1.02);\n      let mouth = sdCutSphere((p + vec3f(0.0, 0.18, -0.65)), 0.38, 0.0);\n      d = opSmoothSubtraction(mouth, d, 0.1);\n      let lEye = sdSphere(p + vec3f(0.22, -0.3, -0.88), 0.14);\n      d = opSmoothSubtraction(lEye, d, 0.1);\n      let rEye = sdSphere(p + vec3f(-0.22, -0.3, -0.88), 0.14);\n      d = opSmoothSubtraction(rEye, d, 0.1);\n      return d;\n    }\n  `,\n})\n\nrt.registerMaterial({\n  sdFunc: /* wgsl */ `\n    let t = U.time * 0.2 - 0.3f;\n    let bounce = pow(sin(t * 0.5), 2.);\n    let d1 = sdD1(pos, t) * 0.8;\n    let d2 = sdD2(pos) * 0.7;\n    let d3 = sdD3(pos);\n    let d4 = d2;\n    // ---\n    let f1 = pow(sin(t), 10f);\n    let f2 = pow(sin(t + 1. / 4. * PI), 16f);\n    let f3 = pow(sin(t + 2. / 4. * PI), 16f);\n    let f4 = pow(sin(t + 3. / 4. * PI), 16f);\n    return (d1 * f1 + d2 * f2 + d3 * f3 + d4 * f4);\n  `,\n  lightFunc: /* wgsl */ `\n    let lambertian = dot(normal, -rd);\n    let bri = 0.1 + lambertian * 0.5;\n    let finalColor = hsv2rgb(vec3&lt;f32&gt;(rgb2hsv(normal * 0.5 + 0.5).x, 0.8, bri)) + vec3f(pow(lambertian, 64f));\n    return vec4&lt;f32&gt;(finalColor, 1.);\n  `,\n})\n\nrt.camera = {\n  pos: {\n    x: 27.3,\n    y: 8.7,\n    z: -16.66239690942345,\n  },\n  spherical: {\n    radius: 0,\n    theta: 0.40271877655055244,\n    phi: -0.7647831800262793,\n  },\n  fov: 120,\n}\n\nrt.setControlsToFree()\n\nrt.start()\n&quot;]}],[0,{&quot;route&quot;:[0,&quot;3D-morphology&quot;],&quot;sketch&quot;:[0,&quot;import ReTina from &#39;https://moloxe.github.io/re-tina/lib.js&#39;\n\nconst rt = new ReTina()\n\nrt.registerMaterial({\n  color: { r: 0, g: 0.9, b: 0.8 },\n  sdFunc: /* wgsl */ `\n    let bounce = pow(sin(U.time * .2), 2.);\n    let d1 = sdTorus(pos, vec2(.8, .2));\n    let d2 = sdBox(pos, vec3(.6));\n    return d1 * bounce + d2 * (1. - bounce);\n  `,\n})\n\nrt.camera.fov = 100\nrt.camera.spherical.radius = 2\nrt.start({\n  onFrame() {\n    rt.camera.spherical.phi += 0.006\n    rt.camera.spherical.theta += 0.006\n  },\n})\n&quot;]}],[0,{&quot;route&quot;:[0,&quot;3D-periodic-surface-beat&quot;],&quot;sketch&quot;:[0,&quot;import ReTina from &#39;https://moloxe.github.io/re-tina/lib.js&#39;\n\nconst rt = new ReTina({\n  functions: /* wgsl */ `\n    const PER_MIN = 0.5;\n    fn getFreq() -&gt; f32 {\n      return (PER_MIN / 60.) * U.beat;\n    }\n    fn sawtooth(time: f32, frequency: f32) -&gt; f32 {\n        return fract(time * frequency);\n    }\n    fn integral_sawtooth(time: f32, frequency: f32) -&gt; f32 {\n        let x = time * frequency;\n        return (0.5 * (floor(x) + (fract(x) * fract(x)))) / frequency;\n    }\n  `,\n})\n\nrt.registerMaterial({\n  sdFunc: /* wgsl */ `\n    let t = integral_sawtooth(U.time, getFreq()) * 0.4;\n    pos = rotate(pos, vec3&lt;f32&gt;(0, t, -t));\n    pos += vec3&lt;f32&gt;(cos(-t) * 16, 2.4, sin(-t) * 16);\n    return (sin(pos.y) - (cos(pos.x) + cos(pos.y) + cos(pos.z))) * .6;\n  `,\n  lightFunc: /* wgsl */ `\n    let lamb = dot(normal, -rd);\n    let aoFactor = calculateDFAO(pos, normal);\n    var c = (normal * .5 + .5) * sqrt(lamb) * aoFactor;\n    let dist = length(pos - ro);\n    let t = 1. - sawtooth(U.time, getFreq());\n    let bri = pow(max(0, sin(dist * PI / 6.)), 6.) * 0.4 + t * 0.8;\n    c *= bri;\n    return vec4(c, 1.);\n  `,\n})\n\nconst beat = rt.registerUniform(&#39;beat&#39;, 60)\n\nlet lastClick = 0\nwindow.addEventListener(&#39;click&#39;, () =&gt; {\n  const now = performance.now()\n  if (lastClick !== 0) {\n    const diff = now - lastClick\n    const newBeat = Math.round(60000 / diff)\n    beat.set(newBeat)\n  }\n  lastClick = now\n})\n\nrt.start()\n&quot;]}],[0,{&quot;route&quot;:[0,&quot;3D-periodic-surface&quot;],&quot;sketch&quot;:[0,&quot;import ReTina from &#39;https://moloxe.github.io/re-tina/lib.js&#39;\n\nconst rt = new ReTina()\n\nrt.registerMaterial({\n  sdFunc: `\n    let t = U.time * .1;\n    pos = rotate(pos, vec3&lt;f32&gt;(0, t, -t));\n    pos += vec3&lt;f32&gt;(cos(-t) * 16, 2.4, sin(-t) * 16);\n    return (sin(pos.y) - (cos(pos.x) + cos(pos.y) + cos(pos.z))) * 0.67;\n  `,\n  lightFunc: `\n    let lamb = dot(normal, -rd);\n    var c = (normal * .5 + .5) * sqrt(lamb);\n    let dist = length(pos - ro);\n    let bri = pow(max(0, sin(dist * PI / 6.)), 6.) + 0.2;\n    c *= bri;\n    return vec4(c, 1.);\n  `,\n})\n\nrt.setControlsToFree()\n\nrt.start()\n&quot;]}],[0,{&quot;route&quot;:[0,&quot;3D-simplex-noise-ocean-fft&quot;],&quot;sketch&quot;:[0,&quot;import ReTina, { getFFTGetter } from &#39;https://moloxe.github.io/re-tina/lib.js&#39;\n\nconst bufferSize = 1024\nconst noiseGate = &#39;0.8f&#39;\nconst soundLevel = &#39;80f&#39;\n\nconst rt = new ReTina({\n  showFps: true,\n  height: 600,\n  useInterlacing: true,\n  buffers: [{ size: bufferSize * 4 }],\n  main: /* wgsl */ `\n    let scene = calcScene(uv);\n    var color = hsv2rgb(vec3f(0.6, 0.4, 0.1));\n    let t = U.time;\n\n    if scene.dist &gt; 0 {\n      color = max(scene.color.rgb, color);\n    } else {\n      let rd = scene.rd;\n      let starStatic = smoothstep(0.85, 1f, snoise3d(vec3f(rd * 100.)));\n      let starMoving = smoothstep(0.85, 1f,\n        snoise3d(rotate(rd, vec3f(-t, t, 0) * 0.01) * 50.)\n      );\n      color = color + (starStatic + starMoving);\n    }\n\n    var xy = uv * 2f - 1f; xy *= vec2f(U.width / U.height, -1f);\n    let pMoon = vec2f(0, 0.65);\n    let dMoon = smoothstep(.01, 0., length(xy - pMoon) - 0.08);\n    let dHalo = smoothstep(.04, 0., length(xy - pMoon) - 0.08);\n    var cTex = snoise(vec2f(xy * 10.)) * 2f;\n    cTex = snoise3d(vec3f(xy * 10., cTex + t * 0.2)) +\n           snoise3d(vec3f(xy * 20., cTex + t * 0.2));\n    var cMoon = (dHalo - dMoon * cTex * 0.2) * (lightColor + 0.1);\n    color = cMoon + color * (1. - dMoon);\n\n    color = pow(color, vec3f(1.2));\n    color = max(color, vec3f(0, 0.05, 0.15));\n    return vec4f(color, 1.0);\n  `,\n  functions: /* wgsl */ `\n    const lakeColor = vec3f(0.0, 1f, 0.7) * 0.4;\n    const lightColor = vec3f(1.0, 0.9, 0.9);\n    const lightPos = vec3f(0, 200.0, -400.0);\n    fn sdFFTBars(pos: vec3f) -&gt; f32 {\n      var dBars = 1e9;\n      let nBars = 28i;\n      for (var i = 0i; i &lt;= nBars; i++) {\n        let val = getBuffer0(i);\n        let h = max(val - ${noiseGate}, 0) * ${soundLevel};\n        let ang = ((-f32(i) - 0.5f) / f32(nBars + 1i)) * TWO_PI;\n        let x = sin(ang) * 20f;\n        let z = -50f + cos(ang) * 20f;\n        let bPos1 = vec3f(x, -8f, z);\n        let bPos2 = vec3f(x, h - 8f, z);\n        let bDist = sdCapsule(pos, bPos1, bPos2, 1.4f);\n        dBars = opSmoothUnion(dBars, bDist, 3.5f);\n      }\n      return dBars;\n    }\n    fn lakeLight(pos: vec3f, normal: vec3f, rd: vec3f, lightPos: vec3f) -&gt; vec3f {\n      let viewDir = -rd;\n      let lightDir = normalize(lightPos - pos);\n      let lambertian = dot(normal, lightDir);\n\n      var specular1 = 0.;\n      var specular2 = 0.;\n      if lambertian &gt; 0. {\n          let halfDir = normalize(lightDir + viewDir);\n          let specAngle = max(dot(halfDir, normal), 0.);\n          specular1 = min(pow(specAngle + 0.02, 100f), 1.);\n          specular2 = min(pow(specAngle + 0.001, 1000f), 1.);\n      }\n\n      let colorLinear = (\n          lakeColor * lambertian * lightColor * 1.2 +\n          specular1 * lakeColor  * lightColor * 0.5 +\n          specular2 * lightColor * 2f);\n\n      return colorLinear;\n    }\n  `,\n})\n\nconst nBars = 28\nconst nyquist = 22050\nconst minFreq = 65\nconst maxFreq = 14000\n\n// Rangos de bins logarítmicos por banda musical (Bark / ISO 1/3 Octave)\nconst binRanges = Array.from({ length: nBars + 1 }, (_, i) =&gt; {\n  const f0 = minFreq * Math.pow(maxFreq / minFreq, i / (nBars + 1))\n  const f1 = minFreq * Math.pow(maxFreq / minFreq, (i + 1) / (nBars + 1))\n  const b0 = Math.max(1, Math.floor((f0 / nyquist) * bufferSize))\n  const b1 = Math.max(\n    b0 + 1,\n    Math.min(bufferSize - 1, Math.ceil((f1 / nyquist) * bufferSize))\n  )\n  return [b0, b1] as const\n})\n\n// Estado persistente: balística temporal y noise floor adaptativo\nconst smoothedValues = new Float32Array(nBars + 1)\nconst noiseFloor = new Float32Array(nBars + 1)\nfor (let i = 0; i &lt;= nBars; i++) {\n  const rel = i / nBars\n  noiseFloor[i] = 0.16 * Math.pow(1 - rel, 0.6) + 0.04\n}\n\nconst gpuBuffer = new Float32Array(bufferSize)\n\nconst getFFT = await getFFTGetter({ bufferSize })\n\nrt.registerMaterial({\n  sdFunc: /* wgsl */ `\n    let water = pos.y;\n    let dFFTBars = sdFFTBars(pos);\n    return opSmoothUnion(water, dFFTBars, 6f);\n  `,\n  lightFunc: /* wgsl */ `\n
